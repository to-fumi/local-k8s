# Argo CD の UI も共有 Gateway にぶら下げる。
# Gateway をアプリ側から local-k8s に移した効果がここで出ていて、
# UI 用に LB IP をもう 1 つ払い出す必要も、トンネルをもう 1 本張る必要もない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: shared
      namespace: istio-ingress
  hostnames:
    - argocd.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # server.insecure=true にしてあるので 80 番が平文 HTTP を喋る。
        - name: argocd-server
          port: 80
